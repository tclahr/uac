version: 1.0
artifacts:
  -
    description: Collect ModSecurity audit and debug logs.
    supported_os: [linux]
    collector: file
    path: /var/log /usr/local/apache/logs /etc/apache2/logs
    name_pattern: ["modsec*", "modsecurity*"]
    file_type: [f, l]
    max_depth: 3
    max_file_size: 1073741824 # 1GB
