version: 2.0
artifacts:
  -
    description: Collect macOS user trash.
    supported_os: [macos]
    collector: file
    path: %user_home%/.Trash
    ignore_date_range: true
    exclude_nologin_users: true
  -
    description: Collect macOS Volumes Trash.
    supported_os: [macos]
    collector: file
    path: /Volumes/<VolumeName>/.Trashes
    ignore_date_range: true
    exclude_nologin_users: true
  -
    description: Collect linux user trash (file & info).
    supported_os: [freebsd, linux, netbsd, openbsd]
    collector: file
    path: %user_home%/.local/share/Trash
    exclude_nologin_users: true
  -
    description: Collect linux trash from removable media (file & info).
    supported_os: [freebsd, linux, netbsd, openbsd]
    collector: file
    path: /
    path_pattern: ["/.Trash-[0-9]*/*"]
    exclude_nologin_users: true
